function model(){return examples.find(x=>x.id===state.instance);}
function available(f){return !f.engine||f.engine===state.engine;}
function currentGroups(){return groups.filter(x=>(!x.engine||x.engine===state.engine)&&(['draft','managed'].includes(x.id)||fields.some(f=>f.group===x.id&&available(f)))).map(x=>state.engine==='llama'&&x.id==='compute'?{...x,label:'计算与线程'}:x);}
function config(){
 const key=state.instance+'/'+state.engine;
 if(!state.configs[key]){
  const values=Object.fromEntries(fields.map(f=>[f.id,copy(f.value)]));
  values.draftOn=model().draft!=='unsupported';
  if(state.engine==='llama'){values.temperature=.8;values.topK=40;values.minP=.05;}
  const initialSource=state.engine==='splash'&&model().draft!=='unsupported'?(state.instance==='qwen38'?sourceB:sourceA):'';
  state.configs[key]={values,baseline:copy(values),saved:copy(values),applied:copy(values),custom:[],source:initialSource,savedSource:initialSource,appliedSource:initialSource,check:null,lastRequest:null,requestOverride:false};
 }
 return state.configs[key];
}
function display(f,value){if(f.type==='secret')return value?'已设置（原型值）':'未设置';if(Array.isArray(value))return value.length?value.join(' · '):'未设置';if(value&&typeof value==='object')return value.mode==='auto'?'自动':value.mode==='off'?(f.offLabel||'关闭'):value.amount+' '+value.unit;if(f.type==='toggle')return value?'开启':'关闭';if(f.type==='select'){const option=f.options.find(o=>(Array.isArray(o)?o[0]:o)===String(value));return option?(Array.isArray(option)?option[1]:option):value;}return value===''?'继承':String(value);}
function changed(){const c=config();const diff=fields.filter(f=>available(f)&&JSON.stringify(c.values[f.id])!==JSON.stringify(c.saved[f.id]));if(c.source!==c.savedSource)diff.push({id:'source',label:'草稿模型来源',group:'draft',type:'text'});return diff;}
function restartPending(){const c=config();return fields.filter(f=>available(f)&&groups.find(g=>g.id===f.group).kind==='load'&&JSON.stringify(c.saved[f.id])!==JSON.stringify(c.applied[f.id])).length+(c.savedSource!==c.appliedSource?1:0);}
function update(id,value){const c=config();c.values[id]=value;if(!c.custom.includes(id))c.custom.push(id);if(fields.find(f=>f.id===id)?.group==='draft')c.check=null;updateStatus();}
function syncUrl(){const q=new URLSearchParams({variant:state.variant,engine:state.engine,instance:state.instance});history.replaceState(null,'','/instances?'+q);}
function inputAttrs(f){return `${f.min!==undefined?` min="${f.min}"`:''}${f.max!==undefined?` max="${f.max}"`:''} step="${f.step||1}"`;}
function renderField(f,forceDisabled=false){
 const c=config(),v=c.values;if(!available(f)||f.when&&!f.when(v))return '';
 const unsupported=f.group==='draft'&&model().draft==='unsupported';
 const disabled=forceDisabled||unsupported||(f.group==='draft'&&f.id!=='draftOn'&&!v.draftOn)||(f.id==='ngram'&&v.draftOn);
 const dis=disabled?' disabled':'';const val=v[f.id];let control='';
 if(f.type==='toggle')control=`<button class="field-toggle ${val?'on':''}" role="switch" aria-checked="${!!val}" aria-label="${esc(f.label)}" data-toggle="${f.id}"${dis}></button>`;
 if(f.type==='range'||f.type==='number')control=`<input type="number" aria-label="${esc(f.label)}" data-field="${f.id}" value="${esc(val)}"${inputAttrs(f)}${dis}>${f.suffix?`<span class="muted tiny">${esc(f.suffix)}</span>`:''}`;
 if(f.type==='select')control=`<select aria-label="${esc(f.label)}" data-field="${f.id}"${dis}>${f.options.map(o=>{const [value,label]=Array.isArray(o)?o:[o,o];return `<option value="${esc(value)}"${String(val)===String(value)?' selected':''}>${esc(label)}</option>`;}).join('')}</select>`;
 if(['text','secret'].includes(f.type))control=`<input type="${f.type==='secret'?'password':'text'}" aria-label="${esc(f.label)}" data-field="${f.id}" value="${esc(val)}"${dis}>`;
 if(f.type==='path')control=`<span class="muted tiny">${val?'已选择示例文件':'未选择'}</span><button data-action="ranking"${dis}>选择文件…</button>`;
 if(f.type==='quantity')control=`<select aria-label="${esc(f.label)}模式" data-quantity-mode="${f.id}"${dis}>${!f.noAuto?`<option value="auto"${val.mode==='auto'?' selected':''}>自动</option>`:''}${f.off?`<option value="off"${val.mode==='off'?' selected':''}>${f.offLabel||'关闭'}</option>`:''}<option value="custom"${val.mode==='custom'?' selected':''}>自定义</option></select><input type="number" aria-label="${esc(f.label)}数值" data-quantity-value="${f.id}" value="${esc(val.amount)}" min="1"${disabled||val.mode!=='custom'?' disabled':''}><select aria-label="${esc(f.label)}单位" data-quantity-unit="${f.id}"${disabled||val.mode!=='custom'?' disabled':''}>${['MiB','GiB'].map(x=>`<option${val.unit===x?' selected':''}>${x}</option>`).join('')}</select>`;
 const source=c.custom.includes(f.id)?'<span class="source-label" style="color:var(--blue)">自定义</span>':'<span class="source-label">示例默认</span>';
 let html=`<div class="field" data-row="${f.id}"><div class="field-top"><div class="field-label">${esc(f.label)}${f.help?`<small>${esc(f.help)}</small>`:''}</div>${!['tags','textarea'].includes(f.type)?`<div class="field-control">${source}<button class="field-reset" title="恢复默认" aria-label="恢复${esc(f.label)}默认值" data-reset="${f.id}"${dis}>↶</button>${control}</div>`:source}</div>`;
 if(f.type==='range')html+=`<input class="field-slider" type="range" aria-label="${esc(f.label)}滑块" data-field="${f.id}" value="${val}"${inputAttrs(f)}${dis}>`;
 if(f.type==='textarea')html+=`<div class="field-control wide"><textarea aria-label="${esc(f.label)}" data-field="${f.id}"${dis}>${esc(val)}</textarea></div>`;
 if(f.type==='tags')html+=`<div class="field-control wide"><div class="tag-editor">${val.map((x,i)=>`<span class="token-tag">${esc(x)}<button data-remove-tag="${f.id}" data-index="${i}" aria-label="移除${esc(x)}">×</button></span>`).join('')}<input aria-label="添加${esc(f.label)}" data-tags="${f.id}" placeholder="输入后按 Enter 添加"${dis}></div></div>`;
 if(f.type==='path'&&val)html+=`<span class="path-value">${esc(val)}</span>`;
 return html+'</div>';
}
function draftStatus(){const c=config(),check=c.check;return `<div class="draft-status"><dl><dt>请求开关</dt><dd>${c.values.draftOn?'开启':'关闭'}</dd><dt>实际状态</dt><dd>${check?esc(check.message):'尚未模拟检查'}</dd><dt>来源目录 / 文件</dt><dd>${c.values.draftOn?esc(c.source||'未选择'):'不加载草稿资源'}</dd><dt>draft 类型</dt><dd>${c.values.draftOn?esc(c.source===sourceA?'DFlashDraftModel':c.source===sourceB?'DFlash2DraftModel':c.source?'待核验':'未选择'):'无'}</dd>${check?.error?`<dt>失败原因</dt><dd style="color:var(--red)">${esc(check.error)}</dd>`:''}</dl></div>`;}
function renderDraft(){const c=config(),v=c.values,m=model();return `<div class="notice ${m.draft==='required'?'blue':''}">${m.draft==='unsupported'?'此示例的 D3 决策路径不支持草稿模型。':state.engine==='splash'&&m.draft==='required'?'此 Splash 生成模型需要匹配的草稿模型。':state.engine==='splash'?'Qwen3.5-4B 可关闭草稿模型；启用时需要标准 DFlash。':'选择当前模型配套的 GGUF 草稿文件和明确的推测模式。'}</div>${renderField(fields.find(f=>f.id==='draftOn'))}<div class="draft-source"><div class="flex between"><div class="fill"><strong style="font-size:12px">${state.engine==='splash'?'本地 safetensors 目录':'本地 GGUF 草稿模型'}</strong><span class="path-value" title="${esc(c.source)}">${esc(c.source||'请选择模型来源')}</span></div><button data-action="pick-draft"${!v.draftOn||m.draft==='unsupported'?' disabled':''}>选择模型…</button><button class="ghost" data-action="clear-draft" aria-label="清除草稿来源"${!v.draftOn?' disabled':''}>×</button></div></div>${state.engine==='splash'?'<div class="notice">草稿执行长度由实际引擎编译定义；不提供无对应原生能力的长度滑块。</div>':''}${fields.filter(f=>f.group==='draft'&&!f.advanced&&f.id!=='draftOn').map(f=>renderField(f)).join('')}<details class="advanced"${v.compact?' open':''}><summary>${state.engine==='splash'?'compact 草稿优化':'设备、缓存与采样'}</summary>${fields.filter(f=>f.group==='draft'&&f.advanced).map(f=>renderField(f)).join('')}${state.engine==='splash'&&v.compact?'<p class="tiny muted">正常回退完整 head 与草稿加载失败分别展示。</p>':''}</details>${draftStatus()}<div class="row-actions" style="margin-top:13px"><button data-action="check-draft">模拟准备检查</button><button class="link" data-action="legacy">查看旧路径失效情境</button></div>`;}
function groupBody(group){
 if(group.id==='draft')return renderDraft();
 if(model().id==='d3'&&group.kind==='generation')return '<div class="notice">此示例为 D3 决策路径，不使用普通文本生成参数。请选择生成实例比较这些控件。</div>';
 if(group.id==='managed')return `<div class="notice">正式应用分配实际运行字段；这里仅展示示例，不连接服务。</div>${[['监听地址','127.0.0.1 · 端口在启动时分配'],['公开模型名',model().model.toLowerCase()],['目标模型文件',model().model+'.gguf'],['程序与 tokenizer','沿用所选引擎和模型资产'],['运行目录','GMD 管理的 assembly / runtime'],['响应模型身份','由软件核对并管理']].map(([label,value])=>`<div class="readonly-row"><span>${label}</span><code>${esc(value)}</code></div>`).join('')}`;
 let fs=fields.filter(f=>f.group===group.id&&available(f));
 if(state.query)fs=fs.filter(f=>(f.label+' '+f.id+' '+(f.help||'')).toLowerCase().includes(state.query.toLowerCase()));
 if(!fs.length)return '<div class="notice">当前引擎没有该组可调项。</div>';
 let body=fs.filter(f=>!f.advanced).map(f=>renderField(f,group.id==='encoder')).join('');
 if(group.id==='encoder')body='<div class="notice">这些选项属于 ModernBERT 编码器，当前示例模型不适用。</div>'+body;
 if(fs.some(f=>f.advanced))body+=`<details class="advanced"${state.query?' open':''}><summary>更多${group.label}参数</summary>${fs.filter(f=>f.advanced).map(f=>renderField(f)).join('')}</details>`;
 if(group.id==='cache'&&state.engine==='splash')body+=`<div class="readonly-row"><span>持久缓存目录</span><span>${config().values.persistent?'由 GMD 分配到实例 runtime/cache':'未启用持久缓存'}</span></div>`;
 if(group.id==='output'&&config().values.responseFormat!=='text'&&config().values.ignoreEos)body+='<div class="notice error">结构化输出与“忽略 EOS”冲突。正式版显示原生拒绝原因。</div>';
 if(group.id==='lookup'&&state.engine==='llama'&&config().values.draftOn)body+='<div class="notice blue">草稿模型已开启，本次只运行选定草稿模式。ngram 设置保留，关闭草稿模型后可生效。</div>';
 if(group.id==='basic'&&!config().values.limitResponse)body+='<p class="tiny muted" style="margin-top:12px">未指定生成上限；由引擎按剩余上下文处理，不自动填入 32 或 4096。</p>';
 return body;
}
function section(group,header=true){return `<section class="section" data-group="${group.id}">${header?`<div class="section-header"><div class="fill"><h2>${group.label}</h2><p class="section-description">${group.note}</p></div><span class="tag ${group.kind==='generation'?'blue':''}">${group.kind==='generation'?'下次请求生效':'重启后生效'}</span></div>`:''}${groupBody(group)}</section>`;}
function actions(extra=''){return `<div class="bottom-actions"><div class="status-copy" data-save-status>修改仅保存在原型内存中</div>${extra}<button data-action="reset-all">恢复示例</button><button class="primary" data-action="save">模拟保存</button></div>`;}
function summary(){return `<aside class="summary-column"><h3>当前实例</h3><div class="summary-line"><span>模型</span><strong>${state.instance==='qwen35'?'Qwen3.5-4B':state.instance==='qwen38'?'Qwen3.8-27B':'D3 mini'}</strong></div><div class="summary-line"><span>引擎</span><span>${state.engine==='splash'?'Splash · 自定义':'llama.cpp · b11457'}</span></div><div class="summary-line"><span>草稿资源</span><span data-summary-draft></span></div><div class="separator"></div><h3>修改与生效</h3><div data-change-count class="tiny muted"></div><ul class="summary-changes" data-changes></ul><div class="notice">请求显式值 → 实例生成默认值 → 引擎默认值</div><div class="separator"></div><h3>模拟下一次请求</h3><label class="tiny"><input type="checkbox" data-request-override ${config().requestOverride?'checked':''}> 本次覆盖温度为 0.4</label><button style="width:100%;margin-top:10px" data-action="request">查看生效参数</button><div data-request-result class="tiny muted" style="margin-top:8px;overflow-wrap:anywhere"></div><div class="separator"></div><button style="width:100%" data-action="restart">模拟重启应用加载配置</button><details class="state-dump"><summary>全部原型状态</summary><pre data-state-dump></pre></details></aside>`;}
function variantA(){let gs=currentGroups();if(state.query)gs=gs.filter(g=>fields.some(f=>f.group===g.id&&available(f)&&(f.label+' '+f.id).toLowerCase().includes(state.query.toLowerCase())));const selected=currentGroups().find(g=>g.id===state.group)||currentGroups()[0];return `<div class="surface layout-a"><div class="panel-top"><div><div class="eyebrow">实例配置 / ${esc(model().name)}</div><h2>参数设置</h2></div><input class="search" aria-label="查找参数" data-search placeholder="查找参数…" value="${esc(state.query)}"></div><div class="a-body"><nav class="section-nav" aria-label="参数分组"><div class="section-nav-label">生成配置</div>${currentGroups().filter(g=>g.kind==='generation').map(g=>`<button data-group-nav="${g.id}" class="${state.group===g.id?'active':''}">${g.label}<small>即时</small></button>`).join('')}<div class="section-nav-label">加载与运行</div>${currentGroups().filter(g=>g.kind==='load').map(g=>`<button data-group-nav="${g.id}" class="${state.group===g.id?'active':''}">${g.label}</button>`).join('')}</nav><div class="a-form"><div class="form-scroll">${state.query?(gs.length?gs.map(g=>section(g)).join('<div class="separator"></div>'):'<div class="not-found">没有匹配的参数</div>'):section(selected)}</div>${actions()}</div>${summary()}</div></div>`;}
function instanceTable(){return `<div class="instance-list"><div class="flex between" style="padding:0 10px 12px"><strong>已保存的实例</strong><button class="ghost" data-action="notice-add">＋ 创建实例</button></div><table class="instance-table"><thead><tr><th>实例</th><th class="optional">模型能力</th><th>状态</th></tr></thead><tbody>${examples.map(m=>`<tr class="${state.instance===m.id?'selected':''}" data-instance-row="${m.id}" style="cursor:pointer"><td><strong>${m.name}</strong><small>${m.model}</small></td><td class="optional">${m.kind}</td><td><span class="tag ${m.id===state.instance?'green':''}">示例已保存</span></td></tr>`).join('')}</tbody></table><p class="tiny muted" style="padding:15px 12px">示例数据 · 点击实例行可更换编辑对象</p></div>`;}
function variantB(){const kinds=state.tab==='generation'?'generation':'load';let gs=currentGroups().filter(g=>g.kind===kinds);if(state.tab==='draft')gs=gs.filter(g=>['draft','lookup','managed'].includes(g.id));return `<div class="layout-b">${instanceTable()}<div class="surface b-drawer"><div class="panel-top"><div><div class="eyebrow">编辑实例</div><h2>${esc(model().name)}</h2></div><span class="tag blue">${state.engine==='splash'?'自定义 Splash':'llama.cpp'}</span></div><div class="b-tabs">${[['generation','生成设置'],['load','加载与运行'],['draft','草稿模型']].map(([key,label])=>`<button data-tab="${key}" class="${state.tab===key?'active':''}">${label}</button>`).join('')}</div><div class="form-scroll">${gs.map((g,i)=>`<details class="accordion" ${i<2||state.tab==='draft'?'open':''}><summary>${g.label}<span class="tag ${g.kind==='generation'?'blue':''}">${g.kind==='generation'?'下次请求':'重启后'}</span></summary><div class="accordion-body"><p class="section-description" style="margin:0 0 8px">${g.note}</p>${groupBody(g)}</div></details>`).join('')}<details class="accordion"><summary>修改与生效状态</summary><div class="accordion-body"><div data-change-count></div><ul class="summary-changes" data-changes></ul><div class="notice">请求显式值 → 实例生成默认值 → 引擎默认值</div><details class="state-dump"><summary>全部原型状态</summary><pre data-state-dump></pre></details></div></details></div>${actions()}</div></div>`;}
function review(){const c=config();return `<div class="review-block"><h3>加载与运行 · 重启后生效</h3><div class="review-grid"><span>引擎</span><strong>${state.engine==='splash'?'Splash · 自定义':'llama.cpp · b11457'}</strong><span>目标模型</span><strong>${esc(model().model)}</strong><span>上下文</span><strong>${esc(c.values.context)}</strong><span>草稿模型</span><strong>${c.values.draftOn?esc(c.source||'尚未选择'):'关闭'}</strong></div></div><div class="review-block"><h3>生成默认值 · 下次请求生效</h3><div class="review-grid"><span>温度</span><strong>${c.values.temperature}</strong><span>Top K / Top P</span><strong>${c.values.topK} / ${c.values.topP}</strong><span>生成上限</span><strong>${c.values.limitResponse?c.values.maxTokens:'由引擎按上下文决定'}</strong><span>输出格式</span><strong>${esc(c.values.responseFormat)}</strong></div></div><div class="review-block"><h3>草稿准备检查（模拟）</h3>${draftStatus()}<button style="margin-top:14px" data-action="check-draft">模拟检查</button></div>`;}
function variantC(){const steps=['加载与运行','生成默认值','草稿模型','检查与保存'];let gs=currentGroups().filter(g=>state.step===0?g.kind==='load'&&!['draft','lookup','managed'].includes(g.id):state.step===1?g.kind==='generation':['draft','lookup'].includes(g.id));return `<div class="surface layout-c"><div class="steps">${steps.map((label,i)=>`<button class="step ${i===state.step?'active':''}" data-step="${i}"><i>${i+1}</i>${label}</button>`).join('')}</div><div class="c-body"><div class="c-editor"><div class="form-scroll"><div class="c-title"><div class="eyebrow">${esc(model().name)} · 步骤 ${state.step+1} / 4</div><h2>${steps[state.step]}</h2><p>${state.step===0?'先确定此实例使用的引擎资源。':state.step===1?'这些设置不要求重启，保存后用于下一次请求。':state.step===2?'明确选择来源，并确认该模型是否允许关闭草稿。':'对照修改和生效时机，再保存到原型内存。'}</p></div>${state.step===3?review():gs.map(g=>section(g)).join('<div class="separator"></div>')}</div><div class="bottom-actions"><div class="status-copy" data-save-status>修改仅保存在原型内存中</div><button data-step="${Math.max(0,state.step-1)}"${state.step===0?' disabled':''}>上一步</button>${state.step<3?`<button class="primary" data-step="${state.step+1}">下一步</button>`:'<button class="primary" data-action="save">模拟保存</button>'}</div></div>${summary()}</div></div>`;}
function render(){
 syncUrl();if(!currentGroups().some(g=>g.id===state.group))state.group='sampling';
 $('#app').innerHTML=`<div class="prototype-note"><strong>一次性 UI 原型</strong><span>所有操作仅修改内存示例，不加载模型或保存正式配置</span><span class="optional">A / B / C 共用同一份编辑状态</span></div><div class="app"><aside class="app-sidebar"><div class="brand"><span class="brand-symbol">⋈</span><span>Ghost<br>Model Deck</span></div><div class="nav-label">模型</div>${[['⌕','发现模型'],['▱','模型库'],['↓','下载']].map(([icon,label])=>`<div class="nav-item"><span class="nav-icon">${icon}</span>${label}</div>`).join('')}<div class="nav-label">服务</div>${[['▧','引擎管理'],['▤','实例'],['⌁','运行监控'],['♧','委员会配置'],['↔','MCP']].map(([icon,label])=>`<div class="nav-item ${label==='实例'?'active':''}"><span class="nav-icon">${icon}</span>${label}</div>`).join('')}<div class="sidebar-footer"><span class="tag green">示例模式</span><p style="margin-top:10px">⚙　设置</p></div></aside><main class="main"><div class="workspace-tabs"><span class="selected">模型管理</span><span>推理测试场</span></div><header class="page-header"><div><h1>实例</h1><p>保存模型、引擎与参数组合；分别管理生成设置和加载配置。</p></div><button data-action="reset-all">重置当前示例</button></header><div class="context-bar"><div><label for="example-instance">编辑实例</label><select id="example-instance" data-instance>${examples.map(m=>`<option value="${m.id}"${state.instance===m.id?' selected':''}>${m.name}</option>`).join('')}</select></div><div><label for="example-engine">引擎</label><select id="example-engine" data-engine><option value="splash"${state.engine==='splash'?' selected':''}>Splash · 自定义版本</option><option value="llama"${state.engine==='llama'?' selected':''}>llama.cpp · b11457（示例）</option></select></div><span class="tag context-extra">参数范围取自现有能力</span><span class="spacer"></span><button data-action="show-state">状态与生效</button><span class="tiny muted context-extra">方案 ${state.variant} · ${variants[state.variant]}</span></div><div class="content">${state.variant==='A'?variantA():state.variant==='B'?variantB():variantC()}</div></main></div><nav class="switcher" aria-label="原型方案切换"><button class="arrow" data-variant-arrow="-1" aria-label="上一个方案">‹</button>${Object.entries(variants).map(([key,label])=>`<button data-variant="${key}" class="${state.variant===key?'selected':''}">${key} · ${label}</button>`).join('')}<button class="arrow" data-variant-arrow="1" aria-label="下一个方案">›</button><span class="switcher-divider"></span><small>← → 切换 · 共享编辑状态</small></nav>`;
 updateStatus();renderPicker();
}
function requestParams(values){return {temperature:values.temperature,top_k:values.topK,top_p:values.topPOn?values.topP:1,min_p:values.minPOn?values.minP:0,[state.engine==='splash'?'repetition_penalty':'repeat_penalty']:values.repeatOn?values.repeatPenalty:1,presence_penalty:values.presenceOn?values.presencePenalty:0,frequency_penalty:values.frequencyOn?values.frequencyPenalty:0,...(values.limitResponse?{max_tokens:values.maxTokens}:{}),...(values.stop.length?{stop:values.stop}:{}),response_format:values.responseFormat};}
function updateStatus(){
 const c=config(),diff=changed(),gen=diff.filter(f=>groups.find(g=>g.id===f.group).kind==='generation').length,load=diff.length-gen,pending=restartPending();
 document.querySelectorAll('[data-row]').forEach(row=>{const label=row.querySelector('.source-label');if(label){label.textContent=c.custom.includes(row.dataset.row)?'自定义':'示例默认';label.style.color=c.custom.includes(row.dataset.row)?'var(--blue)':'';}});
 document.querySelectorAll('[data-change-count]').forEach(el=>el.textContent=`未保存：生成 ${gen} 项 · 加载 ${load} 项${pending?'；已保存待重启 '+pending+' 项':''}`);
 document.querySelectorAll('[data-changes]').forEach(el=>el.innerHTML=diff.length?diff.slice(0,7).map(f=>`<li><b>${esc(f.label)}</b><br><span class="muted">${esc(display(f,f.id==='source'?c.savedSource:c.saved[f.id]))} → </span>${esc(display(f,f.id==='source'?c.source:c.values[f.id]))}</li>`).join(''):'<li class="muted">当前没有未保存的参数修改。</li>');
 document.querySelectorAll('[data-save-status]').forEach(el=>el.textContent=diff.length?`${diff.length} 项未保存 · 仅原型内存`:`${pending?'加载配置待模拟重启 · ':''}示例状态已保存至内存`);
 document.querySelectorAll('[data-summary-draft]').forEach(el=>el.textContent=c.values.draftOn?'已请求开启':'关闭，不加载');
 document.querySelectorAll('[data-state-dump]').forEach(el=>{const values=copy(c.values);if(values.apiKey)values.apiKey='<原型值已隐藏>';el.textContent=JSON.stringify({variant:state.variant,instance:state.instance,engine:state.engine,values,custom:c.custom,draftSource:c.source,preparation:c.check,pendingRestart:pending,lastRequest:c.lastRequest},null,2);});
 document.querySelectorAll('[data-request-result]').forEach(el=>el.textContent=c.lastRequest?`温度 ${c.lastRequest.temperature} · ${c.requestOverride?'本次显式覆盖':'实例已保存默认值'} · 不发出网络请求`:'未模拟请求');
}
let toastTimer;function toast(message){clearTimeout(toastTimer);$('#toast').className='toast';$('#toast').textContent=message;toastTimer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent='';},4200);}
function checkDraft(){const c=config(),v=c.values,m=model();let error='';if(!v.draftOn&&state.engine==='splash'&&m.draft==='required')error='此模型后端需要匹配的 drafter，请启用并选择目录。';if(v.draftOn&&m.draft==='unsupported')error='该决策路径不支持 drafter。';if(v.draftOn&&!c.source)error='已启用草稿模型，请明确选择本地资源。';if(v.draftOn&&c.source===legacy)error='旧 worktree 路径已失效，请重新选择，或在支持的模型上关闭。';if(v.draftOn&&state.engine==='splash'&&c.source!==legacy&&c.source&&(m.id==='qwen35'&&c.source!==sourceA||m.id==='qwen38'&&c.source!==sourceB))error='所选草稿类型与目标模型不兼容；不会自动替换其他目录。';if(v.draftOn&&v.compact&&!v.ranking)error='compact 已开启，缺少 ranking 文件。';c.check={ok:!error,message:error?'模拟检查失败':v.draftOn?'模拟准备检查通过，未加载资源':'模拟确认：不加载草稿资源',error:error||null};render();toast(c.check.message);}
function renderPicker(){if(!state.picker){$('#modal').innerHTML='';return;}if(state.picker==='state'){$('#modal').innerHTML=`<div class="overlay"><div class="picker" role="dialog" aria-modal="true" aria-label="状态与生效"><div class="picker-header flex between"><h2>原型状态与生效预览</h2><button data-action="close-picker">关闭</button></div>${summary()}</div></div>`;updateStatus();return;}const isSplash=state.engine==='splash';const options=isSplash?[{name:'Qwen3.5-4B · 标准 DFlash',path:sourceA,detail:'DFlashDraftModel · 已知本地路径，原型不读取文件'},{name:'Qwen3.8-27B · DFlash2',path:sourceB,detail:'DFlash2DraftModel · 已知本地路径，原型不读取文件'},{name:'旧绑定 · 路径失效',path:legacy,detail:'模拟迁移情境 · 需要用户修复'}]:[{name:'Qwen3.5-4B DFlash · GGUF 示例',path:'prototype://library/qwen35-dflash-bf16.gguf',detail:'示例资源，不代表本机已下载或已验证'},{name:'Qwen3.8-27B DFlash2 · GGUF 示例',path:'prototype://library/qwen38-dflash2-bf16.gguf',detail:'示例资源；实际兼容性由原生加载验证'}];$('#modal').innerHTML=`<div class="overlay" role="presentation"><div class="picker" role="dialog" aria-modal="true" aria-label="选择草稿模型"><div class="picker-header"><h2>选择${isSplash?'草稿模型目录':'GGUF 草稿模型'}</h2><p class="muted tiny" style="margin-top:5px">原型使用预置选项，不打开或扫描本机模型文件。</p></div><div class="picker-options">${options.map(o=>`<button class="picker-option" data-select-source="${esc(o.path)}"><strong>${o.name}</strong><small>${o.detail}</small><small>${esc(o.path)}</small></button>`).join('')}</div><div class="picker-footer"><span class="tiny muted">来源始终由用户明确选择</span><button data-action="close-picker">取消</button></div></div></div>`;}
function switchVariant(key){state.variant=key;render();}
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.matches('[data-search]')){state.query=el.value;const start=el.selectionStart;render();const input=$('[data-search]');input.focus();input.setSelectionRange(start,start);return;}
 if(el.matches('[data-field]')){const f=fields.find(x=>x.id===el.dataset.field);const value=['range','number'].includes(f.type)?el.value===''?'':Number(el.value):el.value;update(f.id,value);document.querySelectorAll(`[data-field="${f.id}"]`).forEach(other=>{if(other!==el)other.value=el.value;});}
 if(el.matches('[data-quantity-value]')){const key=el.dataset.quantityValue;update(key,{...config().values[key],amount:Number(el.value)});}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.matches('[data-instance]')){state.instance=el.value;state.query='';render();return;}
 if(el.matches('[data-engine]')){state.engine=el.value;state.query='';render();return;}
 if(el.matches('[data-request-override]')){config().requestOverride=el.checked;updateStatus();return;}
 if(el.matches('select[data-field]')){update(el.dataset.field,el.value);render();return;}
 if(el.matches('[data-quantity-mode],[data-quantity-unit]')){const key=el.dataset.quantityMode||el.dataset.quantityUnit;update(key,{...config().values[key],[el.dataset.quantityMode?'mode':'unit']:el.value});render();}
});
document.addEventListener('click',event=>{
 const el=event.target.closest('button,[data-instance-row]');if(!el||el.disabled)return;const c=config();
 if(el.dataset.variant){switchVariant(el.dataset.variant);return;}
 if(el.dataset.variantArrow){const keys=Object.keys(variants),i=keys.indexOf(state.variant);switchVariant(keys[(i+Number(el.dataset.variantArrow)+3)%3]);return;}
 if(el.dataset.groupNav){state.group=el.dataset.groupNav;state.query='';render();return;}
 if(el.dataset.tab){state.tab=el.dataset.tab;render();return;}
 if(el.dataset.step!==undefined){state.step=Number(el.dataset.step);render();return;}
 if(el.dataset.instanceRow){state.instance=el.dataset.instanceRow;render();return;}
 if(el.dataset.toggle){update(el.dataset.toggle,!c.values[el.dataset.toggle]);render();return;}
 if(el.dataset.reset){const f=fields.find(f=>f.id===el.dataset.reset);c.values[f.id]=copy(c.baseline[f.id]);c.custom=c.custom.filter(x=>x!==f.id);render();return;}
 if(el.dataset.removeTag){update(el.dataset.removeTag,c.values[el.dataset.removeTag].filter((_,i)=>i!==Number(el.dataset.index)));render();return;}
 if(el.dataset.selectSource){c.source=el.dataset.selectSource;c.values.draftOn=true;c.check=null;state.picker=null;render();toast('示例草稿来源已选择；需要模拟准备检查。');return;}
 const action=el.dataset.action;
 if(action==='show-state'){state.picker='state';renderPicker();return;}
 if(action==='pick-draft'){state.picker='draft';renderPicker();return;}
 if(action==='close-picker'){state.picker=null;renderPicker();return;}
 if(action==='clear-draft'){c.source='';c.check=null;render();return;}
 if(action==='legacy'){if(model().draft==='unsupported'){toast('当前示例决策路径不支持 drafter。');return;}c.source=legacy;c.values.draftOn=true;c.check=null;state.group='draft';state.tab='draft';state.step=2;render();return;}
 if(action==='ranking'){update('ranking','prototype://ranking/compatible-v2.bin');render();toast('已选择示例 ranking；未读取或验证真实文件。');return;}
 if(action==='check-draft'){checkDraft();return;}
 if(action==='save'){c.saved=copy(c.values);c.savedSource=c.source;render();toast('已保存到原型内存：生成默认值用于下次请求，加载配置待重启。');return;}
 if(action==='reset-all'){delete state.configs[state.instance+'/'+state.engine];render();toast('已恢复当前实例的内存示例。');return;}
 if(action==='request'){c.lastRequest=requestParams(c.saved);if(c.requestOverride)c.lastRequest.temperature=.4;updateStatus();toast('已计算示例生效参数，没有发送推理请求。');return;}
 if(action==='restart'){if(changed().length){toast('先模拟保存，再应用已保存的加载配置。');return;}checkDraft();if(c.check?.error){toast('模拟检查失败，加载配置尚未应用。');return;}c.applied=copy(c.saved);c.appliedSource=c.savedSource;render();toast('仅模拟加载配置生效，没有启动或停止进程。');return;}
 if(action==='notice-add')toast('原型固定提供三个示例实例，用于比较编辑结构。');
});
document.addEventListener('keydown',event=>{
 const target=event.target;
 if(event.key==='Escape'&&state.picker){state.picker=null;renderPicker();return;}
 if(target.matches('[data-tags]')&&event.key==='Enter'){event.preventDefault();if(!target.value)return;const key=target.dataset.tags,value=config().values[key];if(key==='stop'&&value.length>=4){toast('Splash 停止字符串最多 4 项。');return;}update(key,[...value,target.value]);render();$(`[data-tags="${key}"]`)?.focus();return;}
 if(target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const keys=Object.keys(variants),i=keys.indexOf(state.variant);switchVariant(keys[(i+(event.key==='ArrowRight'?1:2))%3]);}
});
window.addEventListener('popstate',()=>{const value=new URL(location.href).searchParams.get('variant');if(variants[value]){state.variant=value;render();}});
render();
</script>
</body>
</html>
